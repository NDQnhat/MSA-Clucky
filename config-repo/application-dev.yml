# Development profile overrides — applied to every service when it requests the
# `dev` profile. Secrets still come from env vars; never commit real values.
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      idle-timeout: 120000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:1}

server:
  tomcat:
    threads:
      max: ${TOMCAT_THREADS_MAX:24}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:2}

logging:
  level:
    root: info
    com.clucky: ${APP_LOG_LEVEL:DEBUG}

# Feature flags for local development
cloudinary:
  enabled: ${CLOUDINARY_ENABLED:false}
mail:
  sender:
    enabled: ${MAIL_SENDER_ENABLED:false}

